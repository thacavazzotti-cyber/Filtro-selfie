
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selfie Especial da Heloísa</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:15px;
 background:#f6eafa;
 font-family:Arial,sans-serif;
 text-align:center;color:#654477
}
h2{margin:10px 0}
.area{
 position:relative;
 width:min(100%,400px);
 aspect-ratio:9/16;
 margin:15px auto;
 background:#222;
 overflow:hidden;
 border-radius:16px
}
.area video,.area img{
 position:absolute;inset:0;
 width:100%;height:100%
}
.area video{object-fit:cover}
.area img{pointer-events:none}
.espelho{transform:scaleX(-1)}
button,.salvar{
 display:inline-block;
 background:#9564b9;color:white;
 border:0;border-radius:12px;
 padding:13px;margin:5px;
 font-size:15px;text-decoration:none
}
button:disabled{opacity:.5}
#foto,#videoFinal{
 display:none;
 width:min(100%,400px);
 margin:12px auto;
 border-radius:12px
}
#status{font-size:14px}
</style>
</head>
<body>

<h2>Minha Selfie Especial 💜</h2>
<p>Heloísa - 1 aninho</p>

<div class="area">
 <video id="camera" autoplay playsinline muted></video>
 <img id="moldura" src="moldura.png" alt="Moldura">
</div>

<div>
 <button onclick="virarCamera()" id="virar">
 🔄 Virar câmera
 </button>
</div>

<div>
 <button onclick="tirarFoto()" id="fotoBtn">
 📸 Tirar foto
 </button>
 <button onclick="gravar()" id="gravarBtn">
 🎥 Gravar vídeo
 </button>
 <button onclick="parar()" id="pararBtn" disabled>
 ⏹ Parar
 </button>
</div>

<p id="status">Preparando câmera...</p>

<img id="foto" alt="Sua foto">
<video id="videoFinal" controls playsinline></video>

<div>
 <a id="salvarFoto" class="salvar"
 style="display:none">💜 Salvar foto</a>
 <a id="salvarVideo" class="salvar"
 style="display:none">💜 Salvar vídeo</a>
</div>

<script>
const camera=document.getElementById("camera");
const moldura=document.getElementById("moldura");
const statusEl=document.getElementById("status");

let lado="user";
let stream=null;
let recorder=null;
let partes=[];
let canvas,ctx,animacao;
let urlVideo=null;
let gravando=false;

function mensagem(t){
 statusEl.textContent=t;
}

async function abrirCamera(){
 try{
  if(stream){
   stream.getTracks().forEach(t=>t.stop());
  }

  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:{ideal:lado}},
   audio:false
  });

  camera.srcObject=stream;
  camera.classList.toggle(
   "espelho",lado==="user"
  );
  await camera.play();
  mensagem("Câmera pronta! 💜");
 }catch(e){
  mensagem("Permita acesso à câmera.");
 }
}

async function virarCamera(){
 if(gravando)return;
 lado=lado==="user"?"environment":"user";
 await abrirCamera();
}

function prepararCanvas(){
 canvas=document.createElement("canvas");
 canvas.width=720;
 canvas.height=1280;
 ctx=canvas.getContext("2d");
}

function desenhar(){
 if(!camera.videoWidth)return;

 const w=canvas.width;
 const h=canvas.height;
 const vw=camera.videoWidth;
 const vh=camera.videoHeight;
 const escala=Math.max(w/vw,h/vh);
 const sw=w/escala;
 const sh=h/escala;

 ctx.clearRect(0,0,w,h);
 ctx.save();

 if(lado==="user"){
  ctx.translate(w,0);
  ctx.scale(-1,1);
 }

 ctx.drawImage(
  camera,
  (vw-sw)/2,(vh-sh)/2,
  sw,sh,0,0,w,h
 );

 ctx.restore();

 if(moldura.complete&&moldura.naturalWidth){
  ctx.drawImage(moldura,0,0,w,h);
 }
}

function tirarFoto(){
 if(gravando)return;
 if(!camera.videoWidth){
  mensagem("Aguarde a câmera.");
  return;
 }

 prepararCanvas();
 desenhar();

 const url=canvas.toDataURL("image/png");
 const img=document.getElementById("foto");
 const link=document.getElementById("salvarFoto");

 img.src=url;
 img.style.display="block";
 link.href=url;
 link.download="selfie-heloisa.png";
 link.style.display="inline-block";
 mensagem("Foto pronta! 💜");
}

function atualizarQuadro(){
 desenhar();
 animacao=requestAnimationFrame(atualizarQuadro);
}

function tipoVideo(){
 const tipos=[
  "video/mp4;codecs=avc1.42E01E,mp4a.40.2",
  "video/mp4",
  "video/webm;codecs=vp8,opus",
  "video/webm"
 ];
 return tipos.find(t=>MediaRecorder.isTypeSupported(t))||"";
}

async function gravar(){
 if(gravando)return;

 if(!camera.videoWidth){
  mensagem("Aguarde a câmera.");
  return;
 }

 if(!window.MediaRecorder||
    !HTMLCanvasElement.prototype.captureStream){
  mensagem("Gravação não suportada neste navegador.");
  return;
 }

 let microfone;
 try{
  microfone=await navigator.mediaDevices.getUserMedia({
   audio:true,video:false
  });
 }catch(e){
  mensagem("Permita o acesso ao microfone.");
  return;
 }

 prepararCanvas();
 atualizarQuadro();

 let videoStream;
 try{
  videoStream=canvas.captureStream(30);
 }catch(e){
  cancelAnimationFrame(animacao);
  microfone.getTracks().forEach(t=>t.stop());
  mensagem("Não foi possível capturar o vídeo.");
  return;
 }

 const combinado=new MediaStream([
  ...videoStream.getVideoTracks(),
  ...microfone.getAudioTracks()
 ]);

 const tipo=tipoVideo();

 try{
  recorder=new MediaRecorder(
   combinado,
   tipo?{mimeType:tipo}:undefined
  );
 }catch(e){
  cancelAnimationFrame(animacao);
  combinado.getTracks().forEach(t=>t.stop());
  mensagem("Formato de vídeo incompatível.");
  return;
 }

 partes=[];

 recorder.ondataavailable=e=>{
  if(e.data.size>0)partes.push(e.data);
 };

 recorder.onstop=()=>{
  cancelAnimationFrame(animacao);
  combinado.getTracks().forEach(t=>t.stop());

  const mime=recorder.mimeType||"video/webm";
  const blob=new Blob(partes,{type:mime});

  if(urlVideo)URL.revokeObjectURL(urlVideo);
  urlVideo=URL.createObjectURL(blob);

  const video=document.getElementById("videoFinal");
  const link=document.getElementById("salvarVideo");

  video.src=urlVideo;
  video.style.display="block";

  const extensao=mime.includes("mp4")?"mp4":"webm";
  link.href=urlVideo;
  link.download="video-heloisa."+extensao;
  link.style.display="inline-block";

  gravando=false;
  document.getElementById("gravarBtn").disabled=false;
  document.getElementById("pararBtn").disabled=true;
  document.getElementById("virar").disabled=false;
  document.getElementById("fotoBtn").disabled=false;

  mensagem("Vídeo pronto! Confira o áudio e salve. 💜");
 };

 recorder.onerror=()=>{
  mensagem("Ocorreu um erro na gravação.");
  if(recorder.state!=="inactive")recorder.stop();
 };

 try{
  recorder.start(250);
  gravando=true;
  document.getElementById("gravarBtn").disabled=true;
  document.getElementById("pararBtn").disabled=false;
  document.getElementById("virar").disabled=true;
  document.getElementById("fotoBtn").disabled=true;
  mensagem("🔴 Gravando vídeo com áudio...");
 }catch(e){
  cancelAnimationFrame(animacao);
  combinado.getTracks().forEach(t=>t.stop());
  mensagem("Não foi possível iniciar a gravação.");
 }
}

function parar(){
 if(recorder&&recorder.state==="recording"){
  recorder.stop();
  mensagem("Preparando seu vídeo...");
 }
}

abrirCamera();
</script>
</body>
</html>
